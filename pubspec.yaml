name: debt
description: "A shopkeeper debt management app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.1
  flutter_local_notifications: ^18.0.0
  workmanager: ^0.10.9
  permission_handler: ^11.3.0
  crypto: ^3.0.6
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
